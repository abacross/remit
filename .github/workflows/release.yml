# Release binaries for a version tag (vX.Y.Z): built here in public from the tagged
# commit, with SHA-256 sums, a CycloneDX SBOM, and a signed build provenance
# attestation (Sigstore, through GitHub), so a download can be checked with
#   gh attestation verify <file> --repo abacross/remit
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux binaries are static (musl), so they run on any distribution: a glibc build
          # from ubuntu-latest needed glibc 2.39 and failed on Ubuntu 22.04 (v0.1.0).
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      # Zig is the C compiler and linker for the static builds (aws-lc-sys has C code);
      # both tools come from PyPI into a venv, pinned by version and wheel hash.
      - if: contains(matrix.target, 'musl')
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r .github/release-tools.txt
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release --locked -p remit-cli --target ${{ matrix.target }}
      - if: "!contains(matrix.target, 'musl')"
        run: cargo build --release --locked -p remit-cli --target ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        name: static
        run: file target/${{ matrix.target }}/release/remit | tee /dev/stderr | grep -q 'statically linked'
      - name: package
        run: |
          name="remit-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/remit LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
  # The SBOM is made here, with no permission to write the release or sign for it, so a
  # tool it installs cannot touch the binaries or the attestation.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo install --locked cargo-cyclonedx --version 0.5.9
      - run: |
          cargo cyclonedx --format json --target all --spec-version 1.5
          mkdir -p dist
          cp crates/remit-cli/remit-cli.cdx.json "dist/remit-${GITHUB_REF_NAME}.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/*.cdx.json
          if-no-files-found: error
  release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: sums
        run: cd dist && sha256sum *.tar.gz *.cdx.json > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/SHA256SUMS
