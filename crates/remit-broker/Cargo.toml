[package]
name = "remit-broker"
description = "The Remit broker: a verified warrant chain becomes an AWS STS session stamped with the warrant's identifier, and nothing else does (SPEC section 8.1, ADR 0006)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
remit-core = { path = "../remit-core" }
remit-aws = { path = "../remit-aws" }
remit-log = { path = "../remit-log" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
aws-config = "1.12.0"
aws-types = "1.6.0"
aws-sdk-sts = { version = "1.117.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }

[dev-dependencies]
remit-logstore = { path = "../remit-logstore" }
serde_json = "1.0.151"
