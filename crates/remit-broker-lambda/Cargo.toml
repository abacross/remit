[package]
name = "remit-broker-lambda"
description = "The Remit broker as an AWS Lambda function: it trusts its own configuration, and only a warrant's subject can use it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
remit-broker = { path = "../remit-broker" }
aws-config = "1.12.0"
aws-sdk-sts = { version = "1.117.0", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"] }
lambda_runtime = "1.4.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
