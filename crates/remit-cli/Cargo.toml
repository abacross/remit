[package]
name = "remit-cli"
description = "The remit command: keys, warrants, delegation, and `remit run`, which gives a command AWS credentials scoped by a verified warrant and nothing else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "remit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
remit-core = { path = "../remit-core" }
remit-broker = { path = "../remit-broker" }
remit-approver = { path = "../remit-approver" }
remit-log = { path = "../remit-log" }
remit-logstore = { path = "../remit-logstore" }
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
getrandom = "0.4.3"
clap = { version = "4.6.7", features = ["derive"] }
aws-config = "1.12.0"
aws-sdk-sts = "1.117.0"
aws-sdk-cloudtrail = "1.123.0"
aws-sdk-iam = "1.126.0"
remit-reconcile = { version = "0.1.0", path = "../remit-reconcile" }
serde_json = "1.0.151"
remit-aws = { version = "0.1.0", path = "../remit-aws" }
ureq = "3.4.2"
flate2 = "1.1.10"
