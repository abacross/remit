[workspace]
resolver = "3"
members = ["crates/remit-core", "crates/remit-aws", "crates/remit-broker", "crates/remit-cli", "crates/remit-reconcile", "crates/remit-log", "crates/remit-logstore", "crates/remit-approver", "crates/remit-witness", "crates/remit-broker-lambda"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/abacross/remit"
authors = ["Abacross LLC"]

# ADR 0002: no unsafe anywhere, pedantic clippy, warnings fail CI (scripts/ci.sh).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

# Line tables only: backtraces keep file and line, debug builds stay several times
# smaller (full debug information made target/ grow to 36 GB, 2026-09-30).
[profile.dev]
debug = "line-tables-only"

# Dependencies need no debug information at all: most of the build is the AWS SDK.
[profile.dev.package."*"]
debug = false

# Small release binaries: symbols stripped, one optimisation pass over the whole
# program, and no unwinding tables (a panic still runs the panic hook, then aborts).
[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
